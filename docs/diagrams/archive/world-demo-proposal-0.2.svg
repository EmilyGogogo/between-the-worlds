<text x="80" y="185" font-size="20" fill="#29463f">局部放大图</text>
<text x="80" y="814" font-size="15" fill="#29463f">根隙：草的近地通路   /   岩拱：鱼的水下通路   /   高处：鸟的整体视线</text>
<text x="980" y="180" font-size="22" fill="#29463f">同一发现，三种进入方式</text>
<text x="980" y="222" font-size="16" fill="#29463f">草：根隙里发现水光</text>
<text x="980" y="257" font-size="16" fill="#29463f">鱼：岩拱内抵达花园</text>
<text x="980" y="292" font-size="16" fill="#29463f">鸟：高处看见水路连成整体</text>
<text x="980" y="327" font-size="16" fill="#29463f">无固定顺序、无任务解锁</text>
<text x="980" y="410" font-size="21" fill="#29463f">整岛范围示意</text>
<rect x="980" y="435" width="350" height="220" rx="14" fill="#c8dedb" /><ellipse cx="1155" cy="545" rx="150" ry="100" fill="#b9c69f" /><rect x="1080" y="525" width="100" height="80" fill="none" stroke="#9f7651" stroke-width="2" stroke-dasharray="6 4" />
<text x="980" y="690" font-size="15" fill="#29463f">整岛约 90 × 70 米，空域上限初值 18 米</text>
<text x="980" y="723" font-size="15" fill="#29463f">深色框表示本次发现附近的局部放大区</text>
<text x="980" y="765" font-size="15" fill="#29463f">岸边灰色处为露出水面的岩石／栖点</text>
<text x="980" y="798" font-size="15" fill="#29463f">所有锚点仍需实际碰撞与可见性验证</text>
<text x="60" y="905" font-size="16" fill="#29463f">地图是空间提案，不代表当前游戏场景已修改；所有核心路线必须能返回其他合法身体。</text>
