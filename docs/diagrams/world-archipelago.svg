<text x="900" y="792" font-size="14" fill="#315c51">→ A11 邻岛 → 邻岛巨岩 → 松树 → 海岸岩石 → 草</text>
<text x="900" y="814" font-size="14" fill="#64726b">图例：灰色椭圆＝岩丘（地貌层），蓝色＝牛轭湖；主岛轮廓为示意，未按 D-025 新地形重画</text>
